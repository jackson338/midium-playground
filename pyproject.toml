[project]
name = "playground"
version = "0.1.0"
description = "Generate reader training traces on the MacBook. The LoRA train is out of scope and runs later on the Mac Studio."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
playground = "playground.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playground"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
studio = ["unsloth", "trl", "transformers", "datasets", "torch"]
mlx = ["mlx-vlm==0.7.0", "huggingface-hub>=1.6.0"]
